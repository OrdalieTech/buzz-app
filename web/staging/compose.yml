# Local staging relay for the web build: https://buzz.localhost:${STAGING_PORT:-9443} serves
# dist/web and the relay on one origin, as production does. Run ./staging.sh.
name: buzz-web-staging-${STAGING_PORT:-9443}

services:
  relay:
    image: ghcr.io/block/buzz:sha-f6f6d9a
    environment:
      DATABASE_URL: postgres://buzz:buzz@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      RELAY_URL: wss://buzz.localhost:${STAGING_PORT:-9443}
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:?run staging.sh up}
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: buzz_dev
      BUZZ_S3_SECRET_KEY: buzz_dev_secret
      BUZZ_PAIRING_RELAY_URL: wss://buzz.localhost:${STAGING_PORT:-9443}/pair
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # NIP-AB device pairing sidecar, at /pair.
  pairing:
    image: ghcr.io/block/buzz:sha-f6f6d9a
    entrypoint: buzz-pair-relay
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz
      POSTGRES_DB: buzz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      retries: 30

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 buzz_dev buzz_dev_secret
      && mc mb --ignore-existing local/buzz-media"

  # The production Caddyfile; Caddy serves .localhost names from its local CA.
  caddy:
    environment:
      BUZZ_DOMAIN: buzz.localhost:${STAGING_PORT:-9443}
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${STAGING_PORT:-9443}:${STAGING_PORT:-9443}"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../dist/web:/srv/buzz/web:ro
